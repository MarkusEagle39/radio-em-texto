<!doctype html><html lang="pt-BR"><meta charset="utf-8"><title>Avaliação local de precisão</title><body><h1>Comparação em áudio sintético</h1><p>Mesmo áudio, mesmo texto conhecido. Não mede precisão de rádio real.</p><button id="run">Comparar modelos</button><p id="status">Pronto</p><pre id="results"></pre><script type="module">
const status=document.getElementById('status'), results=document.getElementById('results');
document.getElementById('run').onclick=async()=>{document.getElementById('run').disabled=true;try{const context=new AudioContext({sampleRate:16000});const decoded=await context.decodeAudioData(await(await fetch(new URLSearchParams(location.search).get('case') === 'regiao' ? './_precision-regiao.wav' : new URLSearchParams(location.search).get('case') === 'esportes' ? './_precision-esportes.wav' : './_precision-test.wav')).arrayBuffer());const pcm=decoded.getChannelData(0);await context.close();for(const model of ['base','small']){status.textContent='Preparando '+model;await new Promise((resolve,reject)=>{const worker=new Worker('../../dist/speech-worker.js',{type:'module'});worker.onmessage=({data})=>{if(data.type==='progress'&&data.progress.loaded)status.textContent='Baixando '+model+': '+(data.progress.loaded/1048576).toFixed(1)+' MB do arquivo';if(data.type==='ready'){status.textContent='Transcrevendo com '+model;worker.postMessage({type:'transcribe',audio:pcm.slice(),session:1,audioTime:0,capturedAt:Date.now(),sentAt:Date.now()});}if(data.type==='result'){results.textContent+=JSON.stringify({model,text:data.text,processingMs:data.processingMs})+'\n';worker.terminate();resolve();}if(data.type==='error'){worker.terminate();reject(new Error(data.message));}};worker.onerror=e=>{worker.terminate();reject(new Error(e.message));};worker.postMessage({type:'init',model});});}status.textContent='Comparação concluída';}catch(error){status.textContent='Falha: '+error.message;}};
</script></body></html>
